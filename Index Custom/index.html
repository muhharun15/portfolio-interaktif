<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Judul tab browser sudah disesuaikan -->
    <title>Muhamad Harun | Interactive 3D Portfolio</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    
    <!-- CSS digabungkan ke sini agar lebih ringkas dan otomatis fullscreen -->
    <style>
      body { 
          padding: 0; 
          margin: 0; 
          overflow: hidden; /* Mencegah munculnya scroll bar */
          background-color: #2b2b2b; /* Warna latar gelap senada dengan lab */
      }
      #unity-container { 
          position: absolute; 
          width: 100vw; 
          height: 100vh; 
          top: 0; 
          left: 0; 
      }
      #unity-container.unity-desktop { 
          left: 0; 
          top: 0; 
          transform: none; 
          width: 100vw; 
          height: 100vh; 
      }
      #unity-container.unity-mobile { 
          position: fixed; 
          width: 100%; 
          height: 100%; 
      }
      #unity-canvas { 
          background: #231F20; 
          width: 100%; 
          height: 100%; 
      }
      .unity-mobile #unity-canvas { 
          width: 100%; 
          height: 100%; 
      }
      #unity-loading-bar { 
          position: absolute; 
          left: 50%; 
          top: 50%; 
          transform: translate(-50%, -50%); 
          display: none; 
          text-align: center;
      }
      /* Path gambar disesuaikan karena CSS sekarang berada di index.html */
      #unity-progress-bar-empty { 
          width: 141px; 
          height: 18px; 
          margin-top: 10px; 
          margin-left: auto; 
          margin-right: auto; 
          background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center; 
      }
      #unity-progress-bar-full { 
          width: 0%; 
          height: 18px; 
          margin-top: 10px; 
          background: url('TemplateData/progress-bar-full-dark.png') no-repeat center; 
      }
      /* Menyembunyikan footer bawaan Unity */
      #unity-footer { display: none; }
      .unity-mobile #unity-footer { display: none; }
      #unity-warning { 
          position: absolute; 
          left: 50%; 
          top: 5%; 
          transform: translate(-50%); 
          background: white; 
          padding: 10px; 
          display: none; 
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        
        <!-- Teks loading kustom bergaya hologram cyan -->
        <h2 style="color: #00E5FF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px #00E5FF;">
            Loading Portfolio Muhamad Harun...
        </h2>

        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      
      <!-- Footer tetap ada tapi disembunyikan oleh CSS -->
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Portfolio_WebGL</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Portfolio_WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/Portfolio_WebGL.data.gz",
        frameworkUrl: buildUrl + "/Portfolio_WebGL.framework.js.gz",
        codeUrl: buildUrl + "/Portfolio_WebGL.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Muhharun",
        productName: "Portfolio_WebGL",
        productVersion: "0.0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // Desktop style: Diubah menjadi 100% agar responsif mengikuti CSS
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                if(fullscreenButton) {
                    fullscreenButton.onclick = () => {
                      unityInstance.SetFullscreen(1);
                    };
                }
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
